# CD — KRUMM test-mpfl (KRU-51 + KRU-95):
# - main → stage (auto, build con VITE_KRUMM_API_BASE staging = datos reales)
# - tags v* / workflow_dispatch → prod (gate humano; build MODO REAL vía API /prod)
#
# Credenciales: federación GitHub OIDC → rol AWS krumm-gh-actions-deploy
# (policy v4: buckets stage + prod + dev/preview, dists EDQ39PDNI931R y
# E2OPPVGDO8R75S). Trust: main + tags v* + pull_request (preview).
# Ver docs/security/SECURITY.md §CI/CD y docs/ops/environments.md.
name: CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dist_dir: ${{ steps.build.outputs.dist_dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (stage) — VITE_KRUMM_API_BASE staging
        if: github.ref == 'refs/heads/main'
        env:
          VITE_KRUMM_API_BASE: https://rwm08ik23m.execute-api.us-east-1.amazonaws.com/staging
        run: NODE_ENV=production npm run build
      - name: Build (prod) — VITE_KRUMM_API_BASE /prod (modo real, KRU-97 opción b)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          VITE_KRUMM_API_BASE: https://rwm08ik23m.execute-api.us-east-1.amazonaws.com/prod
        run: NODE_ENV=production npm run build
      - name: Set output
        id: build
        run: echo "dist_dir=dist" >> $GITHUB_OUTPUT
      - name: Upload dist (para los jobs de deploy)
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy-stage:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::931932531447:role/krumm-gh-actions-deploy
          aws-region: us-east-1
      - name: AWS profile stub + credentials file
        run: |
          mkdir -p ~/.aws
          printf '[default]\nregion = us-east-1\n' > ~/.aws/config
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            {
              echo '[default]'
              echo "aws_access_key_id = ${AWS_ACCESS_KEY_ID}"
              echo "aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}"
              if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
                echo "aws_session_token = ${AWS_SESSION_TOKEN}"
              fi
            } > ~/.aws/credentials
            chmod 600 ~/.aws/credentials
          fi
      - name: Deploy to STAGE (S3 + CloudFront invalidation)
        env:
          BUCKET: krumm-stage-frontend-931932531447
          DISTRIBUTION_ID: E2OPPVGDO8R75S
        run: bash scripts/deploy-frontend.sh

  deploy-prod:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::931932531447:role/krumm-gh-actions-deploy
          aws-region: us-east-1
      - name: AWS profile stub + credentials file
        run: |
          mkdir -p ~/.aws
          printf '[default]\nregion = us-east-1\n' > ~/.aws/config
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            {
              echo '[default]'
              echo "aws_access_key_id = ${AWS_ACCESS_KEY_ID}"
              echo "aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}"
              if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
                echo "aws_session_token = ${AWS_SESSION_TOKEN}"
              fi
            } > ~/.aws/credentials
            chmod 600 ~/.aws/credentials
          fi
      - name: Deploy to PROD (S3 + CloudFront invalidation)
        env:
          BUCKET: krumm-staging-frontend-931932531447
          DISTRIBUTION_ID: EDQ39PDNI931R
        run: bash scripts/deploy-frontend.sh

      - name: Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium

      - name: Prod smoke (post-deploy, contra CloudFront live)
        env:
          BASE_URL: https://d3citl7gomy2ql.cloudfront.net
        run: |
          sleep 60
          node scripts/prod-verify-v5.mjs
          node scripts/check-dev-bomb-prod.mjs