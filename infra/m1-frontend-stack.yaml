AWSTemplateFormatVersion: '2010-09-09'
Description: KRUMM M1 — S3 privado + CloudFront OAC para frontend estático (staging)
Parameters:
  BucketName:
    Type: String
    Description: Nombre global del bucket (ej. krumm-staging-frontend-931932531447)
  Comment:
    Type: String
    Default: KRUMM staging frontend
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref Comment
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          Compress: true
          ResponseHeadersPolicyId: !GetAtt
            - ResponseHeadersPolicy
            - Id
        CustomErrorResponses:
          # SPA routing: reescribir 403/404 a /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: krumm-staging-rhp-m1
        Comment: KRUMM M1 staging - security headers (CSP, HSTS, XFO, referrer)
        SecurityHeadersConfig:
          # CSP: la app es 100% same-origin; el único recurso externo son los
          # modelos MediaPipe (face + pose) que se fetchan en worker desde
          # storage.googleapis.com (ver src/telemetry/mediapipeAssets.js).
          # WASM se sirve local desde /mediapipe/wasm.
          # style-src 'unsafe-inline': React usa atributos style=""; auditar en
          # iteración posterior para eliminarlo.
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://storage.googleapis.com; worker-src 'self' blob:; wasm-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
            Override: true
          # X-Frame-Options: DENY (anti clickjacking)
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          # X-Content-Type-Options: nosniff + X-XSS-Protection 1; mode=block
          ContentTypeOptions:
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
          # HSTS 1 año + subdominios; sin preload (aún sin dominio propio)
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true

Outputs:
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
    Description: Dominio CloudFront (https)
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
