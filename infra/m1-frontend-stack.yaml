AWSTemplateFormatVersion: '2010-09-09'
Description: KRUMM M1 — S3 privado + CloudFront OAC para frontend estático (staging)
Parameters:
  BucketName:
    Type: String
    Description: Nombre global del bucket (ej. krumm-staging-frontend-931932531447)
  Comment:
    Type: String
    Default: KRUMM staging frontend
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref Comment
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Aliases:
          Quantity: 2
          Items:
            - krumm.cl
            - www.krumm.cl
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          Compress: true
          ResponseHeadersPolicyId: !GetAtt
            - ResponseHeadersPolicy
            - Id
        CustomErrorResponses:
          # SPA routing: reescribir 403/404 a /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        # Sync con estado live 2026-09-06: dominio krumm.cl/www con cert ACM
        # (antes el template decía CloudFrontDefaultCertificate, drift que un
        # deploy CFN habría revertido el dominio — riesgo detectado en B1).
        ViewerCertificate:
          CloudFrontDefaultCertificate: false
          ACMCertificateArn: arn:aws:acm:us-east-1:931932531447:certificate/d201648d-885c-4aea-b84b-5eef978866db
          SSLSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: krumm-staging-rhp-m3
        Comment: KRUMM staging - security headers v3 (CSP + Google Fonts marca v2, HSTS, XFO, referrer)
        SecurityHeadersConfig:
          # CSP: same-origin + modelos MediaPipe (storage.googleapis.com) +
          # API backend KRUMM (B1, 2026-09-06): rwm08ik23m.execute-api.us-east-1
          # (invitaciones M3 + sesiones/reportes M4). Las policies de CloudFront
          # son inmutables: se renombra a -m3 en cada cambio de CSP.
          # style-src 'unsafe-inline': React usa atributos style=""; auditar en
          # iteración posterior para eliminarlo.
          # m3 (2026-09-07, t_be89dafb): + https://fonts.googleapis.com en
          # style-src y + https://fonts.gstatic.com en font-src (fuentes
          # Archivo/Manrope de la marca v2 — la m2 los bloqueaba y krumm.cl
          # renderizaba con fallback de sistema); wasm-src retirado (directive
          # no reconocida → error de consola por página). CREADA VÍA API
          # (ID aaac7f10-372b-461e-b387-1ed1f2eeadd6) y la distribución
          # EDQ39PDNI931R apunta a ella; m2 eliminada. ATTENCIÓN CFN: el
          # próximo update del stack m1 intentará crear m3 (AlreadyExists si
          # sigue en live) — antes de ese deploy, reconciliar: ver
          # docs/plans/2026-09-07-handoff-h46b-audit-marca-v2.md §CFN.
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://storage.googleapis.com https://rwm08ik23m.execute-api.us-east-1.amazonaws.com; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
            Override: true
          # X-Frame-Options: DENY (anti clickjacking)
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          # X-Content-Type-Options: nosniff + X-XSS-Protection 1; mode=block
          ContentTypeOptions:
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true
          # HSTS 1 año + subdominios; sin preload (aún sin dominio propio)
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true

Outputs:
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
    Description: Dominio CloudFront (https)
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
