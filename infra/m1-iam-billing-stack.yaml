AWSTemplateFormatVersion: '2010-09-09'
Description: >
  KRUMM M1 (cierre) — rol de deploy mínimo privilegio para el frontend de staging
  + presupuesto AWS con alarma Billing vía SNS/email.
  Alcance: s3://krumm-staging-frontend-931932531447 (objetos + list), CloudFront
  distribution EDQ39PDNI931R (CreateInvalidation/GetDistribution), notificaciones
  de presupuesto. Sin recursos de producción.

Parameters:
  StagingBucketName:
    Type: String
    Default: krumm-staging-frontend-931932531447
    Description: Bucket S3 del bundle dist/ de staging (Fase M1).
  StagingDistributionId:
    Type: String
    Default: EDQ39PDNI931R
    Description: Distribution CloudFront de staging (Fase M1).
  AlertEmail:
    Type: String
    Description: Email que recibe las alarmas del presupuesto Billing (requiere confirmar suscripción SNS).
  MonthlyBudgetUSD:
    Type: Number
    Default: 25
    Description: Presupuesto mensual de billing (USD) con alarma al 80% y al 100%.

Resources:
  BillingAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: krumm-staging-billing-alerts

  BillingAlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref BillingAlertsTopic
      Endpoint: !Ref AlertEmail

  StagingBillingBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: krumm-staging-monthly-billing
        BudgetType: COST
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
        TimeUnit: MONTHLY
        CostTypes:
          IncludeTax: true
          IncludeCredit: true
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BillingAlertsTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BillingAlertsTopic

  FrontendDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: krumm-staging-frontend-deploy
      Description: >
        Rol de deploy mínimo privilegio para el frontend de staging KRUMM:
        sync S3 del bucket de staging + invalidación CloudFront. Lo asume el
        usuario a través del permission set de IAM Identity Center
        `krumm-staging-frontend-deploy` (rol reservado AWSReservedSSO_*,
        creado automáticamente al hacer el attach). El patrón de trust acepta
        el ARN del rol reservado CON o SIN segmento de región en el path.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: IdentityCenterPermissionSet
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*AWSReservedSSO_krumm-staging-frontend-deploy_*'
      Policies:
        - PolicyName: krumm-staging-frontend-deploy-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3StagingBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:ListBucketMultipartUploads
                  - s3:ListMultipartUploadParts
                Resource: !Sub 'arn:aws:s3:::${StagingBucketName}'
              - Sid: S3StagingObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListMultipartUploadParts
                  - s3:AbortMultipartUpload
                Resource: !Sub 'arn:aws:s3:::${StagingBucketName}/*'
              - Sid: CloudFrontStaging
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:CreateInvalidation
                Resource:
                  - !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${StagingDistributionId}'
                  - !Sub 'arn:aws:cloudfront::${AWS::AccountId}:invalidation/${StagingDistributionId}/*'

Outputs:
  FrontendDeployRoleArn:
    Description: ARN del rol de deploy (usar en el permission set de IAM Identity Center).
    Value: !GetAtt FrontendDeployRole.Arn
  BillingAlertsTopicArn:
    Description: ARN del topic de alarmas de presupuesto.
    Value: !Ref BillingAlertsTopic
  BudgetName:
    Description: Nombre del presupuesto mensual (fijo por plantilla; el recurso Budget no expone GetAtt en el servicio).
    Value: krumm-staging-monthly-billing
