AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  KRUMM M2 backend aggregate-only — DynamoDB (sessions + audit_log) + Lambda
  (Node 20) + API Gateway HTTP API. Última frontera de privacidad server-side.

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  FrontendBaseUrl:
    Type: String
    Default: 'https://stage.krumm.cl'
    Description: 'Base URL del frontend para el link de la invitación (A.1). En prod usar https://krumm.cl.'
  FrontendBaseUrlProd:
    Type: String
    Default: 'https://krumm.cl'
    Description: 'Base URL para invitaciones creadas vía el stage /prod (KRU-97: misma Lambda/tablas).'
  RetentionDays:
    Type: Number
    Default: 30
    Description: Días de retención antes del TTL (EventBridge Scheduler refuerza).
  CognitoPoolId:
    Type: String
    Default: 'us-east-1_FX1VyzTTA'
    Description: 'A.2 (KRU-113): user pool del login empresa (issuer del JWT authorizer).'
  CognitoClientId:
    Type: String
    Default: '7vpliahah8jbc5fh0d59qbjgej'
    Description: 'A.2: client SPA (audience del JWT). Solo con groups recruiters/admins pasa el authorizer.'

Globals:
  Function:
    Runtime: nodejs20.x
    Handler: backend/src/index.handler
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        SESSIONS_TABLE: !Ref SessionsTable
        AUDIT_LOG_TABLE: !Ref AuditLogTable
        INVITATIONS_TABLE: !Ref InvitationsTable
        KRUMM_RETENTION_DAYS: !Ref RetentionDays
        # A.1: envío real de emails de invitación (SESv2, dominio krumm.cl).
        SES_FROM_EMAIL: 'no-reply@krumm.cl'
        FRONTEND_BASE_URL: !Ref FrontendBaseUrl
        FRONTEND_BASE_URL_PROD: !Ref FrontendBaseUrlProd

Resources:
  # --- DynamoDB: sessions (aggregate-only, TTL 30d) ---
  SessionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'krumm-${Environment}-sessions'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH

  # --- DynamoDB: audit_log (append-only por API; acceso solo via Lambda) ---
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'krumm-${Environment}-audit-log'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: auditId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: auditId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: sessionId-index
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # --- DynamoDB: invitations (single-use tokens, TTL 72h por defecto) ---
  InvitationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'krumm-${Environment}-invitations'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: invitationId
          AttributeType: S
      KeySchema:
        - AttributeName: invitationId
          KeyType: HASH

  # --- Lambda rol mínimo privilegio (solo estas tablas) ---
  SessionsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KrummSessionsDynamoDb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub '${SessionsTable.Arn}'
                  - !Sub '${AuditLogTable.Arn}'
                  - !Sub '${AuditLogTable.Arn}/index/sessionId-index'
                  - !Sub '${InvitationsTable.Arn}'
              # A.1: envío de email de invitación (scoped al identity del dominio,
              # nunca ses:* global).
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource:
                  - !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/krumm.cl'

  # --- Lambda ---
  SessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'krumm-${Environment}-sessions'
      CodeUri: ./dist/
      Role: !GetAtt SessionsFunctionRole.Arn
      Events:
        Sessions:
          Type: HttpApi
          Properties:
            ApiId: !Ref SessionsApi
            Path: /sessions
            Method: POST
        InvitationItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref SessionsApi
            Path: /invitations/{token}
            Method: GET
            # PÚBLICO por diseño: el candidato valida su token single-use sin login.
        # A.2 (KRU-113): las rutas HR (GET /sessions, ANY /sessions/{id},
        # POST /invitations, POST /invitations/{token}/revoke) viven como
        # AWS::ApiGatewayV2::Route nativos con authorizer JWT Cognito — los
        # eventos HttpApi de SAM no soportan Authorizer (solo Auth/IAM).

  # --- A.2 (KRU-113): Cognito JWT authorizer (validación de borde) ---
  # El authorizer valida en el borde: firma (JWKS), issuer, audience y exp.
  # HALLAZGO 2026-09-13: el modelo API actual de APIGW ya NO soporta
  # JwtConfiguration.Claims (ver botocore 1.43.x: solo Audience[lista]+Issuer)
  # → la restricción de grupo (cognito:groups ∈ recruiters/admins) se enforcea
  # en la Lambda (backend/src/index.mjs: isProtectedRoute + isRecruiter), que
  # lee los claims YA VALIDADOS en requestContext.authorizer.claims.
  # Público por diseño: POST /sessions y GET /invitations/{token} (candidato).
  RecruiterAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      # ApiId es REQUIRED (y create-only) en el recurso CFN — el authorizer
      # vive pegado a la API HTTP.
      ApiId: !Ref SessionsApi
      Name: krumm-recruiters-jwt
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        # Audience es LISTA en el modelo actual (mín. 1 entry; el JWT aud debe
        # matchear al menos una).
        Audience:
          - !Ref CognitoClientId
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoPoolId}'

  # --- API Gateway HTTP ---
  SessionsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowOrigins: ['*']
        AllowHeaders: ['content-type', 'authorization', 'x-invitation-id']

  # --- A.2 (KRU-113): rutas HR nativas con JWT authorizer Cognito ---
  # Limitaciones CFN nativas (schema, no el modelo API):
  # 1) La ruta NO acepta Authorizer:{Name,Type} → AuthorizationType +
  #    AuthorizerId (string generado por APIGW). El recurso Authorizer no
  #    expone GetAtt → el ID queda hardcoded (8dpjid = krumm-recruiters-jwt,
  #    creado por ESTE stack). Si se recrea el authorizer: actualizar vía
  #    get_authorizers(ApiId) antes de redeploy.
  # 2) La ruta NO acepta el ARN de Lambda directo → Target debe ser
  #    'integrations/<id>' de un AWS::ApiGatewayV2::Integration.
  # 3) !GetAtt Api.ExecutionArn no existe → el ARN execute-api se construye
  #    con !Ref Api (= id corto de la API).
  # NOTA deploy: al cambiar rutas hay que re-deploy manual del stage 'prod'
  # (ver note KRU-97 abajo).
  # Integración proxy única (compartida por las 4 rutas HR) → Lambda.
  SessionsLambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SessionsApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      PayloadFormatVersion: '1.0'
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SessionsFunction.Arn}/invocations'
  SessionsListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SessionsApi
      RouteKey: GET /sessions
      Target: !Sub 'integrations/${SessionsLambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: 8dpjid
  SessionItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SessionsApi
      RouteKey: ANY /sessions/{id}
      Target: !Sub 'integrations/${SessionsLambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: 8dpjid
  InvitationsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SessionsApi
      RouteKey: POST /invitations
      Target: !Sub 'integrations/${SessionsLambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: 8dpjid
  InvitationRevokeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SessionsApi
      RouteKey: POST /invitations/{token}/revoke
      Target: !Sub 'integrations/${SessionsLambdaIntegration}'
      AuthorizationType: JWT
      AuthorizerId: 8dpjid
  # Invocación Lambda para las rutas nativas (las de eventos SAM ya traen su
  # permiso propio; este cubre todas las rutas con ExecutionArn/*).
  SessionsFunctionApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SessionsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      # HTTP API: stage/method/resource (3 niveles de wildcard).
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SessionsApi}/*/*/*'

  # --- KRU-97 (opción b): stage 'prod' sobre la MISMA API/Lambda/tablas ---
  # /prod y /staging comparten dataset (decisión de datos 2026-09-11: un solo
  # dataset de pilotaje, sin migración). La flag `env` en cada sesión nueva
  # (requestContext.stage) marca el origen de la data.
  # Nota: AutoDeploy NO es soportado en recursos CFN (validación temprana
  # AWS::EarlyValidation::PropertyValidation). El snapshot del stage sigue
  # válido tras updates de código Lambda (el ARN de la función es estable).
  # SI CAMBIAN LAS RUTAS de la API: re-deploy manual del stage prod:
  #   DEPLOY=$(aws apigatewayv2 create-deployment --api-id <API_ID>)
  #   aws apigatewayv2 update-stage --api-id <API_ID> --stage-name prod --deployment-id $DEPLOY
  # (ver docs/ops/environments.md §Backend).
  ProdApiDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    Properties:
      ApiId: !Ref SessionsApi

  ProdApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      StageName: prod
      ApiId: !Ref SessionsApi
      DeploymentId: !Ref ProdApiDeployment

Outputs:
  SessionsApiEndpoint:
    Description: Endpoint base de la API /sessions
    Value: !Sub 'https://${SessionsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  SessionsTableName:
    Value: !Ref SessionsTable
  AuditLogTableName:
    Value: !Ref AuditLogTable