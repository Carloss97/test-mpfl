<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#38271d" />
    <meta
      name="description"
      content="KRUMM: evaluación gamificada con procesamiento local y reportes para revisión humana."
    />
    <!-- G.1 (KRU): fuentes de marca self-hosted (Archivo display + Manrope body):
         src/styles/fonts.css + public/fonts/*.woff2 — reemplaza el CSS externo
         de Google Fonts (render-blocking ~800 ms en Lighthouse, 3er-party). -->
    <!-- G.1 (LCP): preloads de los pesos que definen el LCP del hero —
         Archivo 900 (H1), Archivo 600 (heroes v3), Manrope 400 (párrafo
         hero-copy, el LCP text en runners de red lenta: sin preload el
         swap de fuente demoraba el LCP a 3.2-4.3 s). -->
    <link rel="preload" href="/fonts/Archivo-900-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Archivo-600-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Manrope-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Hero visible above the fold: preload it only on the landing route. A
         global image preload also ran on /portal and /candidato, where the
         image is not used, competing with their route chunk and fonts during
         the Lighthouse cold navigation. The parser still appends this hint
         before the module entry starts on the landing route. -->
    <script src="/route-hints.js" defer></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>KRUMM · Evaluación Gamificada</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
